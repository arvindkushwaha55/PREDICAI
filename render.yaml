# Render deployment for the PREDICAI backend (the Rust edge API).
# Free plan: the service sleeps after ~15 minutes without traffic and
# wakes on the next request (first response can take ~ a minute).
# Render injects PORT automatically; the API reads it in main.rs.
services:
  - type: web
    name: predicai-api
    runtime: docker
    dockerfilePath: ./edge/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
